databases:
  - name: ligma-db
    plan: free
    databaseName: ligma
    user: ligma

services:
  - type: web
    name: ligma-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: ligma-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://ligma-client.onrender.com
      - key: CLIENT_URLS
        value: https://ligma-client.onrender.com,http://localhost:5173
      - key: AI_SERVICE_URL
        fromService:
          name: ligma-ai
          type: web
          property: url

  - type: web
    name: ligma-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://ligma-server.onrender.com
      - key: VITE_SOCKET_URL
        value: https://ligma-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: ligma-ai
    runtime: python
    plan: free
    rootDir: ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
