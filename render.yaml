databases:
	- name: ligma-db
		databaseName: ligma
		user: ligma

services:
	- type: web
		name: ligma-server
		runtime: node
		rootDir: server
		buildCommand: npm install
		startCommand: npm start
		healthCheckPath: /api/health
		envVars:
			- key: NODE_VERSION
				value: 20
			- key: DATABASE_URL
				fromDatabase:
					name: ligma-db
					property: connectionString
			- key: JWT_SECRET
				generateValue: true
			- key: CLIENT_URL
				value: https://ligma-client.onrender.com

	- type: web
		name: ligma-client
		runtime: static
		rootDir: client
		buildCommand: npm install && npm run build
		staticPublishPath: dist
		routes:
			- type: rewrite
				source: /*
				destination: /index.html
